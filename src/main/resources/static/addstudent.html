<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Portal</title>
  <style>
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to right, #6dd5fa, #2980b9, #2c3e50);

    background-repeat: repeat;
    background-size: auto, cover;
    padding: 40px;
    margin: 0;
  }

  .container {
    background: rgba(255, 255, 255, 0.95);
    padding: 30px;
    border-radius: 12px;
    max-width: 700px;
    margin: auto;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
  }

  h2 {
    text-align: center;
    color: #2c3e50;
  }

  input, button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
    font-size: 15px;
  }

  table {
    width: 100%;
    margin-top: 20px;
    border-collapse: collapse;
  }

  table, th, td {
    border: 1px solid #aaa;
  }

  th, td {
    padding: 10px;
    text-align: left;
  }

  button {
    background-color: #3498db;
    color: white;
    border: none;
    font-weight: bold;
  }

  button:hover {
    background-color: #2980b9;
    cursor: pointer;
  }
</style>

</head>
<body>
  <div class="container">
    <h2>Add Student Profile</h2>
    <form id="studentForm">
      <input type="text" name="username" placeholder="Username / Login ID" required />
      <input type="password" name="password" placeholder="Password" required />
      <input type="text" name="name" placeholder="Full Student Name" required />
      <input type="text" name="rollno" placeholder="Roll Number" required />
      <input type="text" name="department" placeholder="Department" required />
      <input type="text" name="course" placeholder="Course (e.g. B.Tech)" />
      <input type="text" name="branch" placeholder="Branch (e.g. CSE)" />
      <input type="text" name="section" placeholder="Section (e.g. A)" />
      <input type="email" name="email" placeholder="Student Email" />
      <input type="text" name="phone" placeholder="Student Phone" />
      <input type="text" name="parentName" placeholder="Parent Name" />
      <input type="text" name="parentPhone" placeholder="Parent Phone" />
      <input type="hidden" name="role" value="student" />
      <button type="submit">Add Student</button>
    </form>

    <h2>Student List</h2>
    <button onclick="loadStudents()">View All Students</button>
    <table id="studentTable" style="display: none;">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Roll No</th>
          <th>Dept</th>
          <th>Course</th>
          <th>Branch</th>
          <th>Email</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    document.getElementById("studentForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const formData = new FormData(this);
      const data = Object.fromEntries(formData.entries());

      try {
        let apiUrl = "/api/students/add";
        if (window.location.protocol === 'file:') {
          apiUrl = "https://render2-10.onrender.com/api/students/add";
        }

        let response = await fetch(apiUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        if (!response.ok && apiUrl !== "https://render2-10.onrender.com/api/students/add") {
          response = await fetch("https://render2-10.onrender.com/api/students/add", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
          });
        }

        if (response.ok) {
          alert("Student profile added successfully!");
          this.reset();
          loadStudents();
        } else {
          alert("Failed to add student.");
        }
      } catch (error) {
        console.error("Error:", error);
        alert("Server error.");
      }
    });

    async function loadStudents() {
      try {
        let apiUrl = "/api/students/all";
        if (window.location.protocol === 'file:') {
          apiUrl = "https://render2-10.onrender.com/api/students/all";
        }

        let response = await fetch(apiUrl);
        if (!response.ok) {
          response = await fetch("https://render2-10.onrender.com/api/students/all");
        }

        const data = await response.json();
        const table = document.getElementById("studentTable");
        const tbody = table.querySelector("tbody");
        tbody.innerHTML = "";
        data.forEach(student => {
          const row = `<tr>
            <td>${student.id}</td>
            <td>${student.name || student.username || '-'}</td>
            <td>${student.rollno || student.username || '-'}</td>
            <td>${student.department || '-'}</td>
            <td>${student.course || '-'}</td>
            <td>${student.branch || '-'}</td>
            <td>${student.email || '-'}</td>
          </tr>`;
          tbody.innerHTML += row;
        });
        table.style.display = "table";
      } catch(err) {
        console.error("Failed to load students:", err);
      }
    }
  </script>
</body>
</html>
